services:
  postgres:
    image: postgres:16
    container_name: claims-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: claims_pass
      POSTGRES_DB: claims_db
    ports:
      - "5432:5432"
    volumes:
      - claims_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_user -d claims_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: claims-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  claims_pg_data: